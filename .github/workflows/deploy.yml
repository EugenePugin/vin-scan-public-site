name: Deploy to Yandex Object Storage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Validate HTML
        run: npx --yes html-validate@11.16.2 "**/*.html"

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync files to Yandex S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "ru-central1"
        run: |
          aws --endpoint-url=https://storage.yandexcloud.net s3 sync site s3://vin-scan.ru/ \
            --cache-control "no-cache, must-revalidate" \
            --delete
